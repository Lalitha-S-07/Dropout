

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - DeserveIQ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
    }
    
    /* Premium gradient background */
    .gradient-bg {
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
    }
    
    /* Glass morphism effect */
    .glass {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
    
    /* Premium input styling */
    .premium-input {
      border: 1px solid #e5e7eb;
      padding-left: 48px !important;
      transition: all 0.3s ease;
    }
    
    .premium-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      outline: none;
    }
    
    /* Icon inside input */
    .input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #6b7280;
    }
    
    /* Premium card styling */
    .premium-card {
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    
    .premium-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
    }
    
    /* Button styling */
    .premium-btn {
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
      transition: all 0.3s ease;
    }
    
    .premium-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(30, 58, 138, 0.3);
    }
    
    /* Loading animation */
    .loader {
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top: 3px solid white;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* Feature card animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .fade-in {
      animation: fadeIn 0.8s ease-out;
    }
    
    /* PIN input styling */
    .pin-input {
      width: 60px;
      height: 60px;
      text-align: center;
      font-size: 28px;
      font-weight: 600;
      margin: 0 8px;
      border-radius: 12px;
      border: 2px solid #e5e7eb;
      transition: all 0.3s ease;
    }
    
    .pin-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      outline: none;
      transform: scale(1.05);
    }
    
    .pin-input.filled {
      border-color: #3b82f6;
      background-color: #f0f9ff;
    }
    
    /* Floating animation for background elements */
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
      100% { transform: translateY(0px); }
    }
    
    .float-animation {
      animation: float 6s ease-in-out infinite;
    }
    
    /* Delay animation for staggered elements */
    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }
    .delay-3 { animation-delay: 0.3s; }
    .delay-4 { animation-delay: 0.4s; }
  </style>
</head>

<body class="min-h-screen gradient-bg flex items-center justify-center relative overflow-hidden">
  <!-- Background decorative elements -->
  <div class="absolute top-20 left-20 w-64 h-64 bg-blue-400 rounded-full mix-blend-multiply filter blur-xl opacity-30 float-animation"></div>
  <div class="absolute bottom-20 right-20 w-64 h-64 bg-blue-600 rounded-full mix-blend-multiply filter blur-xl opacity-30 float-animation delay-2"></div>
  <div class="absolute top-1/2 left-1/3 w-64 h-64 bg-blue-500 rounded-full mix-blend-multiply filter blur-xl opacity-30 float-animation delay-4"></div>
  
  <!-- Login Section -->
  <div class="max-w-md w-full mx-auto p-6 relative z-10">
    <div class="premium-card bg-white p-8 fade-in">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-20 h-20 bg-blue-100 rounded-full mb-4">
          <i class="fas fa-graduation-cap text-blue-600 text-3xl"></i>
        </div>
        <h1 class="text-3xl font-bold text-gray-800 mb-2">DeserveIQ</h1>
        <p class="text-gray-600">Enter your PIN to access the system</p>
      </div>
      
      <!-- Error Message -->
      <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-6 transition-all duration-300">
        <div class="flex items-center">
          <i class="fas fa-exclamation-circle mr-3 text-red-500"></i>
          <div>
            <p class="font-semibold">Authentication Failed</p>
            <p class="text-sm">Invalid PIN. Please try again.</p>
          </div>
        </div>
      </div>
      
      <!-- PIN Input Section -->
      <div class="mb-8">
        <label class="block text-gray-700 font-medium mb-4 text-center">Enter 4-Digit PIN</label>
        <div class="flex justify-center mb-6">
          <div class="flex space-x-2">
            <input type="text" maxlength="1" class="pin-input" id="pin1" onkeyup="moveToNext(this, 'pin2')" oninput="validatePinInput(this)">
            <input type="text" maxlength="1" class="pin-input" id="pin2" onkeyup="moveToNext(this, 'pin3')" oninput="validatePinInput(this)">
            <input type="text" maxlength="1" class="pin-input" id="pin3" onkeyup="moveToNext(this, 'pin4')" oninput="validatePinInput(this)">
            <input type="text" maxlength="1" class="pin-input" id="pin4" onkeyup="moveToNext(this, null)" oninput="validatePinInput(this)">
          </div>
        </div>
        
        <!-- PIN Hint -->
        <div class="text-center">
          <p class="text-sm text-gray-500">
            <i class="fas fa-info-circle mr-1"></i>
            Demo PIN: <span class="font-mono font-semibold text-blue-600">2005</span>
          </p>
        </div>
      </div>
      
      <!-- Login Button -->
      <button onclick="verifyPin()" id="loginBtn" class="premium-btn w-full text-white py-4 text-lg font-semibold rounded-lg flex items-center justify-center">
        <i class="fas fa-sign-in-alt mr-2"></i>
        <span id="loginBtnText">Login to System</span>
        <div id="loginBtnLoader" class="loader ml-2 hidden"></div>
      </button>
      
      <!-- Additional Options -->
      <div class="mt-6 pt-6 border-t border-gray-200">
        <div class="flex justify-between items-center">
          <button class="text-blue-600 hover:text-blue-800 text-sm font-medium transition">
            <i class="fas fa-key mr-1"></i>Forgot PIN?
          </button>
          <button class="text-blue-600 hover:text-blue-800 text-sm font-medium transition">
            <i class="fas fa-question-circle mr-1"></i>Help
          </button>
        </div>
      </div>
    </div>
    
    <!-- Footer Info -->
    <div class="text-center mt-8 text-white">
      <p class="text-sm opacity-80">Secure Authentication Portal</p>
      <p class="text-xs opacity-60 mt-2">&copy; 2023 DeserveIQ. All rights reserved.</p>
    </div>
  </div>

  <script>
    // Function to move to next input field
    function moveToNext(current, nextFieldID) {
      // Add visual feedback for filled input
      if (current.value.length > 0) {
        current.classList.add('filled');
      } else {
        current.classList.remove('filled');
      }
      
      // Handle backspace
      if (event.key === 'Backspace' && current.value.length === 0) {
        // Move to previous field
        const allInputs = ['pin4', 'pin3', 'pin2', 'pin1'];
        const currentIndex = allInputs.indexOf(current.id);
        if (currentIndex < allInputs.length - 1) {
          const prevField = document.getElementById(allInputs[currentIndex + 1]);
          prevField.focus();
          prevField.select();
        }
        return;
      }
      
      // Move to next field if current is filled
      if (current.value.length >= current.maxLength) {
        if (nextFieldID) {
          document.getElementById(nextFieldID).focus();
        } else {
          // Last field, optionally auto-verify
          // verifyPin();
        }
      }
    }
    
    // Validate PIN input (numbers only)
    function validatePinInput(input) {
      // Remove any non-numeric characters
      input.value = input.value.replace(/[^0-9]/g, '');
      
      // Add visual feedback
      if (input.value.length > 0) {
        input.classList.add('filled');
      } else {
        input.classList.remove('filled');
      }
    }
    
    // Verify PIN function
    function verifyPin() {
      const pin1 = document.getElementById('pin1').value;
      const pin2 = document.getElementById('pin2').value;
      const pin3 = document.getElementById('pin3').value;
      const pin4 = document.getElementById('pin4').value;
      const enteredPin = pin1 + pin2 + pin3 + pin4;
      const errorMessage = document.getElementById('errorMessage');
      const loginBtnText = document.getElementById('loginBtnText');
      const loginBtnLoader = document.getElementById('loginBtnLoader');
      const loginBtn = document.getElementById('loginBtn');
      
      // Check if all PIN fields are filled
      if (enteredPin.length !== 4) {
        // Shake animation for incomplete PIN
        errorMessage.innerHTML = `
          <div class="flex items-center">
            <i class="fas fa-exclamation-triangle mr-3 text-yellow-500"></i>
            <div>
              <p class="font-semibold">Incomplete PIN</p>
              <p class="text-sm">Please enter all 4 digits.</p>
            </div>
          </div>
        `;
        errorMessage.classList.remove('hidden');
        errorMessage.classList.add('bg-yellow-50', 'border-yellow-200', 'text-yellow-700');
        errorMessage.classList.remove('bg-red-50', 'border-red-200', 'text-red-700');
        
        // Shake the PIN inputs
        const pinInputs = document.querySelectorAll('.pin-input');
        pinInputs.forEach(input => {
          input.style.animation = 'shake 0.5s';
          setTimeout(() => {
            input.style.animation = '';
          }, 500);
        });
        
        setTimeout(() => {
          errorMessage.classList.add('hidden');
        }, 3000);
        
        return;
      }
      
      // Show loading state
      loginBtnText.textContent = "Authenticating...";
      loginBtnLoader.classList.remove("hidden");
      loginBtn.disabled = true;
      errorMessage.classList.add('hidden');
      
      // Simulate API call delay
      setTimeout(() => {
        if (enteredPin === "2005") {
          // Successful login - redirect to prediction page
          loginBtnText.innerHTML = '<i class="fas fa-check mr-2"></i>Authentication Successful';
          loginBtnLoader.classList.add("hidden");
          
          // Add success animation
          const pinInputs = document.querySelectorAll('.pin-input');
          pinInputs.forEach(input => {
            input.classList.add('bg-green-50', 'border-green-500');
          });
          
          // Redirect after success animation
          setTimeout(() => {
            window.location.href = 'predict.html';
          }, 1500);
        } else {
          // Failed login
          errorMessage.innerHTML = `
            <div class="flex items-center">
              <i class="fas fa-exclamation-circle mr-3 text-red-500"></i>
              <div>
                <p class="font-semibold">Authentication Failed</p>
                <p class="text-sm">Invalid PIN. Please try again.</p>
              </div>
            </div>
          `;
          errorMessage.classList.remove('hidden');
          errorMessage.classList.add('bg-red-50', 'border-red-200', 'text-red-700');
          errorMessage.classList.remove('bg-yellow-50', 'border-yellow-200', 'text-yellow-700');
          
          // Shake animation for incorrect PIN
          const pinInputs = document.querySelectorAll('.pin-input');
          pinInputs.forEach(input => {
            input.style.animation = 'shake 0.5s';
            input.classList.add('bg-red-50', 'border-red-500');
            setTimeout(() => {
              input.style.animation = '';
              input.classList.remove('bg-red-50', 'border-red-500');
            }, 500);
          });
          
          // Clear the PIN fields
          document.getElementById('pin1').value = '';
          document.getElementById('pin2').value = '';
          document.getElementById('pin3').value = '';
          document.getElementById('pin4').value = '';
          
          // Remove filled class
          pinInputs.forEach(input => {
            input.classList.remove('filled');
          });
          
          // Focus on first field
          document.getElementById('pin1').focus();
          
          // Reset button state
          loginBtnText.textContent = "Login to System";
          loginBtnLoader.classList.add("hidden");
          loginBtn.disabled = false;
          
          // Hide error message after 5 seconds
          setTimeout(() => {
            errorMessage.classList.add('hidden');
          }, 5000);
        }
      }, 1500);
    }
    
    // Add shake animation
    const style = document.createElement('style');
    style.textContent = `
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
        20%, 40%, 60%, 80% { transform: translateX(5px); }
      }
    `;
    document.head.appendChild(style);
    
    // Focus on the first PIN input field when page loads
    window.onload = function() {
      document.getElementById('pin1').focus();
      
      // Add keyboard navigation
      document.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
          verifyPin();
        }
      });
    };
  </script>
</body>
</html>
